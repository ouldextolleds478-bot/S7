<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экопункт · Форма заказа</title>
  <link rel="stylesheet" href="style.css">
  <!-- Добавлено для PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#24547a">
</head>
<body>
  <!-- Шапка с названием -->
  <header>
    <p>Экопункт · V26</p>
  </header>

  <main class="page">
    <!-- Меню навигации (как на других страницах) -->
    <nav>
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
    </nav>

    <h2>Оформление заказа</h2>

    <form id="order-form" style="margin-top: 20px;">
      <div style="margin-bottom: 15px;">
        <label for="product-select" style="display: block; margin-bottom: 5px;">Выберите товар:</label>
        <select id="product-select" style="width: 100%; max-width: 400px; padding: 8px;">
          <option value="50000" data-extra="0">Смартфон (50000 ₽)</option>
          <option value="15000" data-extra="0">Наушники (15000 ₽)</option>
          <option value="25000" data-extra="0">Умные часы (25000 ₽)</option>
        </select>
      </div>

      <div style="margin-bottom: 15px;">
        <label for="quantity-input" style="display: block; margin-bottom: 5px;">Количество:</label>
        <input type="number" id="quantity-input" required placeholder="Например, 2" style="width: 100%; max-width: 400px; padding: 8px;">
      </div>

      <button type="submit" style="padding: 10px 20px; cursor: pointer;">Рассчитать</button>
    </form>

    <!-- Блоки для вывода результата и ошибок -->
    <div id="result-box" style="font-weight: bold; margin-top: 20px; font-size: 1.2em; color: darkgreen;"></div>
    <div id="error-box" style="font-weight: bold; margin-top: 20px; font-size: 1.2em; color: red;"></div>

    <footer>
      <p>Учебный прототип · Вариант 26</p>
    </footer>
  </main>

  <script src="form.js"></script>
</body>
</html>
