<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин электроники · V26</title>
  <link rel="stylesheet" href="style.css">
  <!-- Добавлено для PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#24547a">
</head>
<body>
  <header>
    <p>Магазин электроники · V26</p>
  </header>

  <main class="page">
    <nav>
      <a href="catalog.html">Каталог</a>
      <a href="form.html">Форма</a>
    </nav>

    <h1>Добро пожаловать в магазин электроники (обновлено)</h1>
    <p>Учебная версия 2</p>

    <!-- Шаг 3: Абзац для статуса и счетчика -->
    <p id="status" role="status"></p>

    <!-- Шаг 5 + Доп. задание 1: Кнопки и список -->
    <button id="show-names" type="button">Показать названия</button>
    <button id="hide-names" type="button">Скрыть названия</button>
    <ul id="names" style="display: none;"></ul> <!-- Список изначально скрыт -->

    <div class="main-actions" style="margin-top: 20px;">
      <a href="catalog.html">Открыть каталог</a>
      <a href="form.html">Оформить заказ</a>
    </div>

    <footer>
      <p>Учебный прототип · Вариант 26</p>
    </footer>
  </main>

  <script src="catalog.js" defer></script>
  <!-- Регистрация Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function (error) {
        console.error("Не удалось зарегистрировать service worker:", error);
      });
    }
  </script>
</body>
</html>
